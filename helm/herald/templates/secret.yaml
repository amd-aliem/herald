{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "herald.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "herald.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Web API credentials — injected as environment variables.
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- with .Values.secrets.anthropicCustomHeaders }}
  ANTHROPIC_CUSTOM_HEADERS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubToken }}
  GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
  # Per-team Teams webhook files, mounted at /app/config/secrets/<team>.json.
  {{- range $team, $url := .Values.secrets.teamWebhooks }}
  {{ $team }}.json: |
    {"teams_webhook_url": {{ $url | quote }}}
  {{- end }}
{{- end }}
